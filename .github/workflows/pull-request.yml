name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f -not -path './vendor/*'))"
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build
        run: go build ./...
